server {
    listen 8110;
    server_name 187.127.171.93 _;

    client_max_body_size 20M;

    location /static/ {
        alias /home/django_user/apps/uae_crtn/staticfiles/;
    }

    location /media/ {
        alias /home/django_user/apps/uae_crtn/media/;
    }

    location / {
        include proxy_params;
        proxy_pass http://127.0.0.1:8111;
        proxy_redirect off;
    }
}
